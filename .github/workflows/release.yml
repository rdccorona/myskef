# Publishes a Myskef release whenever main gets a new version number
# (APP_VERSION in myskef-core.sh, matching Info.plist). Pushes that keep the
# same version are only checked, not released.
# GitHub builds the window for Apple silicon and Intel, so nobody needs
# Apple's developer tools, then attaches Myskef.zip + its SHA-256 checksum.
# Every Myskef with this repository in Resources/update.conf offers the update.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^APP_VERSION="\(.*\)"$/\1/p' Myskef.app/Contents/Resources/myskef-core.sh | head -n1)
          p=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Myskef.app/Contents/Info.plist)
          [ -n "$v" ] && [ "$v" = "$p" ] || { echo "::error::APP_VERSION ($v) and Info.plist ($p) must match"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists: nothing to publish."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the window (Apple silicon + Intel)
        if: steps.ver.outputs.publish == 'yes'
        run: |
          SRC=Myskef.app/Contents/Resources/ui/MyskefUI.swift
          xcrun swiftc --version
          for arch in arm64 x86_64; do
            xcrun swiftc -swift-version 5 -O -parse-as-library -target "$arch-apple-macos13.0" -o "ui-$arch" "$SRC"
          done
          lipo -create ui-arm64 ui-x86_64 -output Myskef.app/Contents/MacOS/MyskefUI
          sum=$(shasum -a 256 "$SRC" | cut -c1-16)
          printf 'arm64-%s\nx86_64-%s\n' "$sum" "$sum" > Myskef.app/Contents/MacOS/MyskefUI.hash
          chmod +x Myskef.app/Contents/MacOS/Myskef Myskef.app/Contents/MacOS/MyskefUI
          codesign --force -s - Myskef.app/Contents/MacOS/MyskefUI

      - name: Package
        if: steps.ver.outputs.publish == 'yes'
        run: |
          ditto -c -k --sequesterRsrc --keepParent Myskef.app Myskef.zip
          shasum -a 256 Myskef.zip | awk '{print $1 "  Myskef.zip"}' > Myskef.zip.sha256
          cp "Myskef.app/Contents/Resources/Read me first.txt" Read-me-first.txt

      - name: Publish the release
        if: steps.ver.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          [ -f release-notes.md ] || echo "Myskef $V" > release-notes.md
          gh release create "v$V" Myskef.zip Myskef.zip.sha256 Read-me-first.txt \
            --target "$GITHUB_SHA" --title "Myskef $V" --notes-file release-notes.md
